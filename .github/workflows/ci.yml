name: ci

on:
  pull_request:
  # Two lines. next is the integration branch: work lands on it directly and is
  # lived with there. main is the vetted branch releases are cut from, reached
  # by a promotion pull request from next. Both run the whole workflow on push,
  # so a landing is verified on the exact state that landed.
  push:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the main-only publish-coverage-badge job widens to
# contents: write, to publish the Rust coverage badge to the badges branch. Every
# other job, including the coverage measurement that builds pull-request code,
# stays read-only.
permissions:
  contents: read

jobs:
  # Detect whether the change needs the expensive jobs (the Windows backend
  # matrix, the frontend build, and the compiling Rust workspace jobs) or is
  # documentation-only. A pull request or a push that touches only Markdown
  # skips them; any other path runs them, as does any event without a range. The
  # verdict is consumed by the gated jobs' `if:` and by the always-running
  # `ci-gate` sentinel below, which is the required check.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the base..head range resolves to the PR's commits.
          fetch-depth: 0
          persist-credentials: false
      # Pure git + POSIX shell, so no language runtime is needed. Emits code=false
      # only when every changed path is Markdown. On a push the range is the
      # pushed commits (the ref before..after), so a documentation-only push to
      # either line skips the expensive jobs too. A push that creates a branch
      # has no before (the all-zero SHA), so it resolves to code=true.
      #
      # The gating LOGIC runs from the BASE commit's copy of the script, not the
      # PR head's, so a fork pull request cannot rewrite the classifier to emit
      # code=false and skip the test gates. The trusted base script still
      # classifies the head's actual diff (the changed-file list is data the fork
      # cannot forge); only the docs-vs-code rules come from the base. The script
      # reads the range from the event env and accepts --repo-root, so it runs
      # standalone over the checked-out head. If it is absent on the base (the
      # commit that first introduced it, or any other non-gated event), the step
      # falls back to code=true so the suite runs.
      - name: Classify the change scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            push) base_sha="$PUSH_BEFORE_SHA" ;;
            *) base_sha="" ;;
          esac
          script=".github/scripts/classify-change-scope.sh"
          base_script="$RUNNER_TEMP/classify-change-scope.base.sh"
          if [ -n "$base_sha" ] && git show "$base_sha:$script" > "$base_script" 2>/dev/null; then
            echo "Classifying from the base commit's script ($base_sha)."
            bash "$base_script" --repo-root "$GITHUB_WORKSPACE"
          else
            echo "Classifier absent on the base (or no gated range); code=true (run the jobs)."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  golden-ratification:
    name: Golden ratification guard
    runs-on: ubuntu-latest
    # The guard compares the changed commits against their base, so it needs a
    # two-sided range: a pull request's base..head at review time, and the
    # pushed commits' before..after on either line, so the exact state that
    # landed is re-verified. A push that creates a branch has no before (git
    # reports the all-zero SHA): the resolver then inspects from the merge base
    # with the default branch, or skips when the pushed commits are already on
    # another branch, so a branch-creating push never bypasses the guard.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the base..head range resolves to the PR's commits.
          fetch-depth: 0
          persist-credentials: false
      # The resolver decides what the guard inspects, so on a pull request it
      # runs from the BASE commit's copy (the same fork-safety rule as the
      # change-scope classifier): a fork cannot rewrite it to skip the guard.
      # A push is the maintainer's own, so the checked-out copy is trusted.
      - name: Resolve the change range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PUSH_CREATED: ${{ github.event.created }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          script=".github/scripts/resolve-change-range.sh"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_script="$RUNNER_TEMP/resolve-change-range.base.sh"
            if ! git show "$PR_BASE_SHA:$script" > "$base_script" 2>/dev/null; then
              echo "::error::The range resolver is absent on the pull request's base commit; failing closed."
              exit 1
            fi
            script="$base_script"
          fi
          bash "$script"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (branch SHA; dtolnay has no semver tags)
        if: steps.range.outputs.skip != 'true'
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.range.outputs.skip != 'true'
        with:
          workspaces: app/src-tauri
          # Restrict cache writes to the trusted main and next timelines; pull-request
          # runs restore read-only so a branch cannot seed or poison the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      # Fail when a commit modifies a committed golden (a scenario fingerprint /
      # DB-state snapshot, an HTTP-response or OpenAPI snapshot, or a consistency
      # golden) without BOTH the documented 'test: regenerate goldens'
      # commit-message marker AND a recorded adversarial ratification verdict. The
      # marker proves the regeneration was conscious; the verdict supplies the
      # correctness sign-off the marker cannot. The verdict is a report committed
      # to app/src-tauri/ratifications/<slug>.md in this same PR range,
      # carrying an 'ORACLE-RATIFICATION ... VERDICT: ratification-sound' block
      # that names the changed sets, so a recorded adversarial verdict stands
      # behind the diff and a stale verdict from a prior regeneration cannot bless
      # a fresh golden change. Together this stops a regression being silently
      # ratified by regenerating the expected output. CI can only presence-check
      # and parse the verdict, not prove the review happened; that residual is
      # closed by the report being reviewer-visible and by the human merge to
      # main. The guard is a subcommand of the in-tree cargo xtask, so it
      # fails closed on any range it cannot resolve.
      - name: Guard golden ratification
        if: steps.range.outputs.skip != 'true'
        working-directory: app/src-tauri
        # A pull request's base..head, or the pushed commits' before..after: the
        # same commits, golden edits, and ratification report either way.
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: cargo run -q -p xtask -- ratify-check --range "$RANGE_BASE..$RANGE_HEAD"

  authoring-lint:
    name: Authoring lint
    runs-on: ubuntu-latest
    # The lint is diff-scoped, so it needs a base..head range to know which lines
    # and commits the change adds: a pull request's base..head at review time,
    # and the pushed commits' before..after on either line (the exact lines and
    # messages that landed), mirroring the golden-ratification guard above,
    # including how a branch-creating push resolves its range. The
    # version-stamp parity check and the source disciplines are whole-tree
    # rather than diff-scoped, so they run unconditionally as their own steps
    # below (and locally via the pre-commit hook).
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the base..head range resolves to the PR's commits.
          fetch-depth: 0
          persist-credentials: false
      # The resolver decides what the guard inspects, so on a pull request it
      # runs from the BASE commit's copy (the same fork-safety rule as the
      # change-scope classifier): a fork cannot rewrite it to skip the guard.
      # A push is the maintainer's own, so the checked-out copy is trusted.
      - name: Resolve the change range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PUSH_CREATED: ${{ github.event.created }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          script=".github/scripts/resolve-change-range.sh"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_script="$RUNNER_TEMP/resolve-change-range.base.sh"
            if ! git show "$PR_BASE_SHA:$script" > "$base_script" 2>/dev/null; then
              echo "::error::The range resolver is absent on the pull request's base commit; failing closed."
              exit 1
            fi
            script="$base_script"
          fi
          bash "$script"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (branch SHA; dtolnay has no semver tags)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app/src-tauri
          # Restrict cache writes to the trusted main and next timelines; pull-request
          # runs restore read-only so a branch cannot seed or poison the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      # Flag em dashes (U+2014) in any added line, US spellings in added prose
      # lines (docs + comments), and, over the added prose lines and the commit
      # messages in the range, references to files the repository does not have,
      # iteration tokens, and tool-attribution lines. Only what this change adds
      # is inspected: pre-existing content is out of scope by construction, so
      # the gate binds new authoring without forcing a drive-by sweep of the old.
      # A subcommand of the in-tree cargo xtask.
      - name: Lint newly authored lines and commit messages
        if: steps.range.outputs.skip != 'true'
        working-directory: app/src-tauri
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: cargo run -q -p xtask -- authoring-lint --range "$RANGE_BASE..$RANGE_HEAD"

      - name: Check version-stamp parity
        working-directory: app/src-tauri
        # Whole-tree, not diff-scoped: the three version stamps (frontend
        # package.json, the Cargo workspace package, tauri.conf.json) must agree.
        # authoring-lint is a required input of the ci-gate aggregator, so this
        # binds the parity check on every pull request and push, not just locally.
        run: cargo run -q -p xtask -- version-stamps

      - name: Check the source disciplines
        working-directory: app/src-tauri
        # Whole-tree guards over the tracked source: the visibility-gated
        # polling discipline, the frozen svelte/store legacy surface (new
        # shared state is runes-native), the route line ceilings (routes
        # stay thin shells over feature modules; ceilings only ratchet
        # down), the market accounting boundary (estimated markup is
        # informational and never joins a realised figure), and the
        # in-development register (a surface shipping ahead of its capability
        # is declared once and marked where it renders; graduating it deletes
        # both), and the latest-in-time read convention (a database read that
        # means "the newest" orders by its timestamp column; an id-ordered read
        # names its allowed case at the site). All bind on every pull request
        # and push through this required job.
        run: |
          cargo run -q -p xtask -- no-bare-setinterval
          cargo run -q -p xtask -- no-new-writable
          cargo run -q -p xtask -- route-ceilings
          cargo run -q -p xtask -- market-isolation
          cargo run -q -p xtask -- in-development
          cargo run -q -p xtask -- id-order

  frontend:
    name: Frontend (build + check + test)
    runs-on: ubuntu-latest
    # Skipped on a documentation-only pull request, like the backend matrix; the
    # ci-gate sentinel covers the required-check report in that case.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      # Biome lint + format gate over the TypeScript and JavaScript sources
      # (Svelte components stay under svelte-check above).
      - run: npm run lint
      - run: npm run test

  frontend-e2e:
    name: Frontend e2e + visual (native shell, Windows)
    runs-on: windows-latest
    # Drives the REAL Tauri WebView2 shell through tauri-driver (not a browser),
    # so it runs on Windows, the app's platform, and compiles the shell. It is
    # the only surface that exercises the native IPC command boundary end to end.
    # Gated on change scope like the backend matrix.
    #
    # BLOCKING (a required input of the ci-gate aggregator): the suite drives the
    # app at its own tauri:// origin (native IPC) with the deterministic in-process
    # typed read-command stub, and every visual capture is gated on a recovered inner
    # viewport (ensureViewport), so the WebView2 inner-viewport collapse is
    # absorbed rather than flaking the gate. A failure uploads the actual + diff
    # PNGs for inspection.
    #
    # TEMPORARILY DISABLED: the runner image's WebView2 150 update broke
    # WebDriver session creation for every run of this job (the DevTools
    # remote-debugging endpoint does not come up under the runner's elevated
    # execution context; MicrosoftEdge/WebView2Feedback#5640). An explicit
    # remote-debugging port, a de-elevated basic-user launch, and a medium
    # integrity label on the shell binary all failed to restore the endpoint
    # on the runner, while the identical suite passes on a real Windows
    # machine. Until the upstream regression is fixed, the suite runs locally
    # (`npm run test:e2e` / `npm run test:visual`) and the ci-gate tolerates
    # this job's skip. Re-enable by restoring the change-scope condition:
    # if: needs.changes.outputs.code == 'true'
    needs: [changes]
    if: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (branch SHA; dtolnay has no semver tags)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app/src-tauri
          # Restrict cache writes to the trusted main and next timelines; pull-request
          # runs restore read-only so a branch cannot seed or poison the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      - run: npm ci
      # tauri-driver bridges WebdriverIO to the platform WebView2 WebDriver.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # The Edge WebDriver must match the runner's WebView2 Evergreen runtime
      # version exactly, so it is resolved at run time rather than committed.
      - name: Fetch the matching WebView2 driver
        shell: pwsh
        run: |
          # The app runs on the WebView2 Evergreen RUNTIME, whose version can
          # diverge from the Edge browser's after a runner-image update (the
          # divergence broke WebDriver session creation with a
          # DevToolsActivePort error when Edge 150 landed on the image). The
          # authoritative runtime version is its versioned install directory;
          # the registry updater key for the runtime carries the updater
          # component's own version (1.3.x), so it is useless here, and the
          # browser keys are a fallback only. Readings are printed for
          # diagnosis.
          $webviewDir = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $runtime = $webviewDir.Name
          $browserKey = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $browser = (Get-ItemProperty $browserKey -ErrorAction SilentlyContinue).pv
          if (-not $browser) { $browser = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Edge\BLBeacon" -ErrorAction SilentlyContinue).version }
          Write-Host "WebView2 runtime version: $runtime"
          Write-Host "Edge browser version: $browser"
          $pv = $runtime
          if (-not $pv) { $pv = $browser }
          if (-not $pv) { throw "could not determine the WebView2 / Edge version" }
          Write-Host "Driver version selected: $pv"
          New-Item -ItemType Directory -Force -Path e2e/.drivers | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath e2e/.drivers -Force
      # The e2e build embeds the frontend and serves it at the app's own tauri://
      # origin (native IPC), built with the `e2e-stub` feature (the in-process
      # typed read-command fixture stub) and E2E_FREEZE_TWEENS (chart-tween determinism
      # for the visual baselines). tauri.e2e.conf.json is an e2e-only overlay
      # (capture window size + CSP) that never ships.
      - name: Build the e2e shell
        run: npx tauri build --debug --no-bundle --features e2e-stub --config src-tauri/entropia-orme/tauri.e2e.conf.json
        env:
          E2E_FREEZE_TWEENS: '1'
          # Scope the plugin-store preferences to an e2e-only file so the test
          # shell never shares preference state with a real installation (a
          # no-op on the clean runner image; load-bearing for local runs on a
          # machine that also carries a real profile).
          E2E_ISOLATED_PREFS: '1'
      # Workaround for the WebView2 150 WebDriver regression
      # (MicrosoftEdge/WebView2Feedback#5640): the DevTools remote-debugging
      # endpoint does not come up when the host process runs at high
      # integrity, this runner's default (administrator, UAC disabled), so
      # WebDriver session creation fails with "DevToolsActivePort file
      # doesn't exist". Verified empirically on this runner: the endpoint is
      # DOWN from an elevated launch, and UP on the same runtime when the
      # host runs at medium integrity. A process's integrity level is capped
      # by its executable's integrity label, so labelling the e2e shell
      # binary medium makes every launch of it (including msedgedriver's)
      # run at medium integrity, which is also what a real user's session
      # runs at. Remove once the upstream regression is fixed.
      - name: Cap the e2e shell to medium integrity (WebView2 150 workaround)
        shell: pwsh
        run: |
          icacls 'src-tauri\target\debug\entropia-orme.exe' /setintegritylevel medium
          # Confirm the DevTools endpoint now comes up from an elevated parent.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9231'
          $env:ENTROPIAORME_DATA_DIR = "$env:RUNNER_TEMP\ildiag"
          Start-Process (Join-Path (Get-Location) 'src-tauri\target\debug\entropia-orme.exe')
          Start-Sleep -Seconds 20
          try {
            $v = Invoke-RestMethod 'http://127.0.0.1:9231/json/version' -TimeoutSec 5
            Write-Host "DevTools endpoint after the integrity cap: UP ($($v.Browser))"
          } catch {
            Write-Host "DevTools endpoint after the integrity cap: DOWN ($($_.Exception.Message))"
          }
          Get-Process entropia-orme -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      - name: Run the native-shell e2e suite
        run: npm run test:e2e
      - name: Run the visual regression suite
        run: npm run test:visual
      # On failure, publish the actual + diff PNGs the visual suite writes so a
      # mismatch is inspectable: the diff is otherwise discarded with the runner.
      # Path is repo-root relative;
      # upload-artifact does not honour the job's working-directory default.
      # include-hidden-files is required: the output dir starts with a dot, and
      # v4 excludes hidden paths by default (which would upload nothing).
      - name: Upload visual diff on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/e2e/.visual-output
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust-policy:
    name: Rust workspace (fmt + audit + deny)
    runs-on: ubuntu-latest
    # Cheap source- and manifest-level checks on the Rust workspace (the Tauri
    # shell plus the native-backend members), so they run unconditionally like
    # the other lint-class jobs above. Formatting reads the source of every
    # member; the audit and licence/ban gates read the workspace Cargo.lock, so
    # none of them compile anything and an ubuntu runner is sufficient and fast.
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (branch SHA; dtolnay has no semver tags)
        with:
          toolchain: 1.96.0
          components: rustfmt
      # Prebuilt binaries rather than cargo install, which would compile both
      # tools from source on every run.
      - uses: taiki-e/install-action@5ebac0d9522d786674368e47e92963ba13f2c376 # v2.82.11
        with:
          tool: cargo-audit,cargo-deny
      - name: Check formatting
        run: cargo fmt --check
      # -D warnings makes the ignore policy in .cargo/audit.toml load-bearing:
      # an advisory not explicitly ignored there fails the job rather than
      # scrolling past as a warning.
      - name: Audit the dependency tree (RustSec advisories)
        run: cargo audit -D warnings
      # Advisories, licence allowlist, bans, and registry sources, per the
      # policy in deny.toml.
      - name: Check the supply-chain policy (licences, bans, sources)
        run: cargo deny check

  rust:
    name: Rust workspace (clippy + build + test, Windows)
    runs-on: windows-latest
    # Compiles the whole workspace, so it runs on the application's real target
    # rather than linting the Linux configuration of a Windows-only artefact
    # (most of the shell sits behind cfg(windows)). Skipped on a
    # documentation-only pull request like the backend matrix; the ci-gate
    # sentinel covers the required-check report in that case.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (branch SHA; dtolnay has no semver tags)
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app/src-tauri
          # Restrict cache writes to the trusted main and next timelines; pull-request
          # runs restore read-only so a branch cannot seed or poison the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      # --all-targets lints the test and bench code too; -D warnings promotes
      # every lint to a failure so the gate cannot drift into an
      # ignored-warnings state.
      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # A debug compile check of every member; the release bundle (tauri build)
      # stays a manual release-time step. The debug profile resolves the
      # frontend through the dev URL, so the shell compiles without a frontend
      # build present.
      - name: Compile check
        run: cargo build
      # Prebuilt binary, same rationale as the members job. nextest applies the
      # committed per-test terminating timeout (.config/nextest.toml), so an
      # intermittent hook-lifecycle hang is killed at 120s instead of stalling
      # the job to the runner ceiling.
      - uses: taiki-e/install-action@5ebac0d9522d786674368e47e92963ba13f2c376 # v2.82.11
        with:
          tool: cargo-nextest
      - name: Run workspace tests
        timeout-minutes: 20
        run: cargo nextest run --workspace
      # The e2e fixture/DTO drift tripwires only compile under the e2e-stub
      # feature (the module they test is feature-gated), so the plain
      # workspace run never sees them; without this leg a typed-command DTO
      # gaining a field fails as an opaque e2e session error on the Windows
      # visual job instead of as a named fixture-drift test.
      - name: Run e2e fixture drift tests
        timeout-minutes: 10
        run: cargo nextest run -p entropia-orme --features e2e-stub -E 'test(fixture)'
      # nextest does NOT run doctests; keep them on a dedicated cargo-test leg so
      # doctest coverage is not silently dropped by the migration.
      - name: Run workspace doctests
        timeout-minutes: 10
        run: cargo test --workspace --doc

  rust-members:
    name: Rust backend members (nextest, Linux)
    runs-on: ubuntu-latest
    # The native-backend members (eo-api, eo-services, eo-wire) must
    # build and test without the Tauri toolchain. This runner is the structural proof: it
    # has none of the Tauri system stack installed (webkit2gtk et al.), and the
    # package selection keeps the shell crate (the only Tauri-coupled member)
    # out of the dependency graph entirely, so a GUI dependency creeping into
    # backend code fails this job rather than landing silently. Skipped on a
    # documentation-only pull request like the backend matrix; the ci-gate
    # sentinel covers the required-check report in that case.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (branch SHA; dtolnay has no semver tags)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app/src-tauri
          # Restrict cache writes to the trusted main and next timelines; pull-request
          # runs restore read-only so a branch cannot seed or poison the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      # Prebuilt binary rather than cargo install (same rationale as the
      # policy job's tools).
      - uses: taiki-e/install-action@5ebac0d9522d786674368e47e92963ba13f2c376 # v2.82.11
        with:
          tool: cargo-nextest
      - name: Run the backend-member tests (nextest)
        run: cargo nextest run -p eo-wire -p eo-services -p eo-api
      # Fails when the committed TypeScript bindings drift from the typed
      # command manifest (the typed-command twin of the frontend job's
      # OpenAPI drift gate).
      - name: Check the generated TypeScript bindings are current
        run: cargo run -q -p xtask -- gen-ts --check
      # The criterion micro-benchmark rail, compile-check only: shared CI
      # runners produce noisy timings, so benchmark figures are taken locally
      # when a hot path lands, and CI guarantees the benches keep building.
      - name: Compile the criterion benches
        run: cargo bench -p eo-services --no-run

  linux-bundle:
    name: Linux build + bundle (deb)
    runs-on: ubuntu-latest
    # Proves the Linux port builds the full Tauri shell and produces an
    # installable package. It is the platform counterpart of the Windows
    # e2e job's shell build: a Linux-only regression (a platform seam that
    # stops compiling, a bundler/resource misconfiguration) fails here
    # rather than surfacing only at release. Skipped on a
    # documentation-only pull request; the ci-gate sentinel covers the
    # required-check report in that case.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The Tauri build chain's system libraries (WebKitGTK, GTK, the
      # appindicator/rsvg stack) plus the bundler's helpers.
      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (branch SHA; dtolnay has no semver tags)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install the frontend dependencies
        working-directory: app
        run: npm ci
      # Build the shell and bundle the .deb through the Linux config
      # overlay (deb target, the Linux ONNX Runtime resource). AppImage is
      # built locally and in the release job; the per-push gate stays on
      # the deb, which needs no FUSE and proves the same build + resource
      # wiring.
      - name: Build and bundle the Linux package
        working-directory: app
        run: npm run tauri -- build --config src-tauri/entropia-orme/tauri.linux.conf.json --bundles deb
      - name: Confirm the .deb was produced
        run: |
          deb=$(find app/src-tauri/target -name '*.deb' | head -1)
          if [ -z "$deb" ]; then echo "::error::no .deb produced by the Linux bundle"; exit 1; fi
          echo "built $deb"
      - name: Upload the Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb-${{ github.run_id }}
          path: app/src-tauri/target/**/*.deb
          if-no-files-found: error

  rust-coverage:
    name: Rust backend members (branch coverage)
    runs-on: ubuntu-latest
    # Measures per-member branch coverage over the native-backend members.
    # The figure is review evidence, not vanity: a ported service's branch
    # coverage shows whether its tests actually exercise the code paths its
    # behavioural-equivalence claim rests on, so it is read against the
    # service's pre-port coverage whenever a port lands. Branch-level
    # instrumentation is a nightly-only compiler feature, hence the pinned
    # nightly toolchain on this measurement job (the gating test run stays on
    # stable in the members job above; this job re-runs the same tests, so a
    # test failure fails here too). Skipped on documentation-only pull
    # requests like the backend matrix.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Pin the exact nightly (branch-coverage instrumentation is a nightly-only
      # compiler feature) so the measured figure is reproducible run to run. The
      # action ref is pinned to the nightly branch SHA (dtolnay has no semver
      # tags); the dated nightly itself is pinned via the toolchain input below.
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly (branch SHA; dtolnay has no semver tags)
        with:
          toolchain: nightly-2026-06-17
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app/src-tauri
          # Restrict cache writes to the trusted main and next timelines; pull-request
          # runs restore read-only so a branch cannot seed or poison the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      - uses: taiki-e/install-action@5ebac0d9522d786674368e47e92963ba13f2c376 # v2.82.11
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Run the tests once and collect coverage without rendering a report, so
      # the human summary and the badge JSON below both read the same single run
      # rather than re-executing the suite.
      - name: Measure branch coverage (cargo-llvm-cov)
        run: cargo llvm-cov nextest --branch --no-report -p eo-wire -p eo-services
      - name: Summarise branch coverage
        run: cargo llvm-cov report --branch --summary-only -p eo-wire -p eo-services
      # Reduce the measured coverage to the shields.io endpoint document the
      # README's Coverage badge points at. Built on every run so the pipeline is
      # exercised in review; published (next step) only from main so the figure
      # tracks the trunk, matching the mutation badge's main-only publish.
      - name: Build coverage badge
        run: |
          cargo llvm-cov report --branch --json -p eo-wire -p eo-services --output-path coverage-llvm.json
          bash ../../.github/scripts/coverage-badge.sh coverage-llvm.json coverage.json
      # Hand the badge to the main-only publish job as an artifact rather than
      # pushing here: this job builds pull-request-author code (tests, build
      # scripts, proc-macros), so it must never carry a write-scoped token. The
      # badge is only published from the trunk, so it is only uploaded there.
      - name: Upload coverage badge
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          # Repo-root relative: upload-artifact ignores the job's working-directory.
          path: app/src-tauri/coverage.json
          if-no-files-found: error
          retention-days: 1

  # Publish the coverage badge to the badges branch, from the trunk only. Kept
  # separate from the measurement job so the write-scoped token never attaches
  # to a run that builds pull-request code: this job runs no PR-author code, it
  # only downloads the badge artifact and pushes it. Not a gating check (it is a
  # main-only side effect), so it is absent from ci-gate's needs.
  publish-coverage-badge:
    name: Publish coverage badge
    runs-on: ubuntu-latest
    needs: [rust-coverage]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
      - name: Publish coverage badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-badge.sh coverage.json

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    # The SINGLE required check on the default branch: it subsumes every gating
    # job (the frontend build, the Rust workspace, golden ratification, and the
    # authoring lint) so branch protection requires only this one context and
    # never drifts when an individual job is added, renamed, or removed. It
    # always runs (if: always()), so it always reports a status, and it is
    # fail-closed: it passes only when the change is documentation-only (the
    # change-scope-gated jobs were legitimately skipped) or when every gated job
    # succeeded. A detection that did not run cleanly, or a code change whose
    # jobs did not pass, fails it, so a skip can never let an untested change
    # merge. This lets a documentation-only pull request go green in seconds
    # without deadlocking on a never-reported required job.
    needs: [changes, golden-ratification, authoring-lint, frontend, frontend-e2e, rust-policy, rust, rust-members, rust-coverage, linux-bundle]
    if: always()
    steps:
      - name: Require the gated jobs to have passed (or been documentation-only)
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GOLDEN_RATIFICATION_RESULT: ${{ needs.golden-ratification.result }}
          AUTHORING_LINT_RESULT: ${{ needs.authoring-lint.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          RUST_POLICY_RESULT: ${{ needs.rust-policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_MEMBERS_RESULT: ${{ needs.rust-members.result }}
          RUST_COVERAGE_RESULT: ${{ needs.rust-coverage.result }}
          LINUX_BUNDLE_RESULT: ${{ needs.linux-bundle.result }}
        shell: bash
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change-scope detection did not succeed (result: $CHANGES_RESULT); failing closed."
            exit 1
          fi
          # The Rust policy job is unconditional (it does not compile, so it is
          # not gated on change scope) and must pass on every run, a push to main
          # included.
          if [ "$RUST_POLICY_RESULT" != "success" ]; then
            echo "::error::The Rust workspace policy checks (fmt, audit, deny) did not pass (result: $RUST_POLICY_RESULT)."
            exit 1
          fi
          # The golden ratification guard and the authoring lint run on every
          # pull request and push (a branch-creating push whose commits are all
          # already on another branch skips their diff-scoped step inside the
          # job, which still succeeds), so both must succeed outright on every
          # run.
          if [ "$GOLDEN_RATIFICATION_RESULT" != "success" ]; then
            echo "::error::The golden ratification guard did not pass (result: $GOLDEN_RATIFICATION_RESULT)."
            exit 1
          fi
          if [ "$AUTHORING_LINT_RESULT" != "success" ]; then
            echo "::error::The authoring lint did not pass (result: $AUTHORING_LINT_RESULT)."
            exit 1
          fi
          if [ "$CODE" = "false" ]; then
            echo "Documentation-only change; the frontend build and Rust workspace jobs were skipped. Gate satisfied."
            exit 0
          fi
          # The native-shell e2e + visual job (frontend-e2e) is normally a
          # REQUIRED input: it drives the app at its tauri:// origin (native
          # IPC) with the deterministic in-process typed read-command stub. It
          # is TEMPORARILY DISABLED (see the job's own comment: the runner
          # image's WebView2 150 update broke WebDriver session creation for
          # every run, MicrosoftEdge/WebView2Feedback#5640), so the gate
          # tolerates its skip; a real failure on a run where the job is
          # re-enabled still fails the gate.
          if [ "$FRONTEND_E2E_RESULT" != "success" ] && [ "$FRONTEND_E2E_RESULT" != "skipped" ]; then
            echo "::error::The native-shell e2e suite did not pass (result: $FRONTEND_E2E_RESULT)."
            exit 1
          fi
          if [ "$FRONTEND_RESULT" = "success" ] && [ "$RUST_RESULT" = "success" ] && [ "$RUST_MEMBERS_RESULT" = "success" ] && [ "$RUST_COVERAGE_RESULT" = "success" ] && [ "$LINUX_BUNDLE_RESULT" = "success" ]; then
            echo "Frontend build, Rust workspace, and Linux build+bundle jobs passed (native-shell e2e temporarily disabled). Gate satisfied."
            exit 0
          fi
          echo "::error::A code change must pass the frontend build, the Rust workspace jobs, and the Linux build+bundle (frontend: $FRONTEND_RESULT, rust: $RUST_RESULT, members: $RUST_MEMBERS_RESULT, coverage: $RUST_COVERAGE_RESULT, e2e: $FRONTEND_E2E_RESULT, linux-bundle: $LINUX_BUNDLE_RESULT)."
          exit 1
