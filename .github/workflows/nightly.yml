name: nightly

on:
  schedule:
    # 07:00 UTC daily, off-peak.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the publish-mutation-badge job widens to contents: write
# so the mutation-score badge can be pushed to the badges branch. The campaign
# job itself stays read-only (it builds repository code), mirroring the coverage
# measure/publish split in ci.yml.
permissions:
  contents: read

jobs:
  rust-mutation:
    name: Mutation testing (shard ${{ matrix.shard }}/8)
    # The mutation campaign over the native-backend workspace members, the proof
    # the test net has no holes. The Tauri shell stays out of the campaign: its
    # logic is OS-window plumbing behind cfg(windows), and building it needs the
    # Tauri system toolchain this Linux runner deliberately lacks. The campaign
    # is sharded across parallel runners because the full run exceeds the 6-hour
    # hosted-job ceiling on a single runner; each shard tests a deterministic
    # slice of the mutant set and reports its outcomes to the verdict job below,
    # which merges them for the floors gate and the badge.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0 (branch SHA; dtolnay has no semver release tags)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          # One cache entry shared by every shard (their build inputs are
          # identical); writes restricted to the trusted main timeline so a
          # branch cannot seed or poison the cache.
          shared-key: mutation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilt binary rather than cargo install, which would compile the
      # tool from source on every run.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-mutants
      # Package selection scopes both the mutants and the per-mutant test runs
      # to the backend members, keeping the Tauri-coupled shell out of the
      # build graph entirely. --in-place because member tests read committed
      # fixtures from the repo outside this cargo workspace (for example the
      # relocated corpus under app/src-tauri/fixtures/), which
      # cargo-mutants' default copied build tree does not contain. Exit codes 2
      # (missed mutants) and 3 (timed-out mutants) are outcome reports, tolerated
      # here because the floors gate in the verdict job is the acceptance bar (it
      # counts a timeout as caught); anything else (usage error, failing
      # baseline, internal error) still fails this shard.
      - name: Run mutation campaign shard (backend members)
        run: cargo mutants --package eo-wire --package eo-services --in-place --shard ${{ matrix.shard }}/8 || { rc=$?; test "$rc" -eq 2 -o "$rc" -eq 3; }
      # Every shard hands its outcomes to the verdict job; if-no-files-found
      # fails closed so a shard that produced nothing cannot silently thin the
      # merged campaign.
      - name: Upload shard outcomes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-outcomes-${{ matrix.shard }}
          # Repo-root relative: upload-artifact ignores the job's working-directory.
          path: app/src-tauri/mutants.out/outcomes.json
          if-no-files-found: error
          retention-days: 1

  mutation-verdict:
    name: Mutation verdict (floors + badge)
    # Merges the shard outcomes (the floors tool sums per-file counts across
    # repeated --outcomes flags), builds the aggregate-score badge, then
    # enforces the per-file floor map: adopted files must hold their floor
    # (floors only ratchet up), while unadopted files are non-blocking and
    # merely reported as awaiting coverage, so a newly added file never reds
    # the nightly. Badge before gate, so the published badge still reflects
    # reality on a regression.
    runs-on: ubuntu-latest
    needs: [rust-mutation]
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0 (branch SHA; dtolnay has no semver release tags)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-outcomes-*
          path: mutation-shards
      - name: Merge shard outcomes into badge and floors verdict
        run: |
          set -euo pipefail
          # Repo-root relative: download-artifact ignores the job's working-directory.
          mapfile -t shard_files < <(find "$GITHUB_WORKSPACE/mutation-shards" -name outcomes.json | sort)
          if [ "${#shard_files[@]}" -ne 8 ]; then
            echo "::error::expected 8 shard outcome files, found ${#shard_files[@]}; refusing a partial campaign verdict."
            exit 1
          fi
          outcome_flags=()
          for f in "${shard_files[@]}"; do outcome_flags+=(--outcomes "$f"); done
          # Badge first (badge-only mode always exits 0, so the badge reflects
          # reality even when the floors gate below fails), then the gate.
          cargo run -q -p xtask -- mutation-floors "${outcome_flags[@]}" --badge-out mutation.json
          cargo run -q -p xtask -- mutation-floors "${outcome_flags[@]}"
      # Hand the badge to the main-only publish job as an artifact rather than
      # pushing here: this job builds repository code, so it must never carry a
      # write-scoped token (mirrors the coverage measure/publish split).
      - name: Upload mutation badge
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-badge
          # Repo-root relative: upload-artifact ignores the job's working-directory.
          path: app/src-tauri/mutation.json
          if-no-files-found: error
          retention-days: 1

  # Publish the mutation badge to the badges branch, from the trunk only. Kept
  # separate from the verdict job so the write-scoped token never attaches to a
  # run that builds repository code: this job runs no repository code, it only
  # downloads the badge artifact and pushes it. if: always() so the badge still
  # publishes when the floors gate failed (the badge then shows the regressed
  # figure, matching the measure-then-publish-then-enforce ordering above).
  publish-mutation-badge:
    name: Publish mutation badge
    runs-on: ubuntu-latest
    needs: [mutation-verdict]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-badge
      - name: Publish mutation badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-badge.sh mutation.json
