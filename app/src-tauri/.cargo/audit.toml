# cargo-audit configuration
#
# Every advisory ignored here is on a transitive crate, not a direct
# dependency: most sit inside the Tauri toolchain, and the zbus family sits
# under the Linux screen-capture portal client. None are exploitable in the
# shipped artefacts; none are fixable here without an upstream release that
# bumps the relevant subtree. Resolution path for each category is "wait for
# upstream"; the per-advisory comments below spell out why each is
# non-actionable.
#
# Categorisation note: every entry below is an `unmaintained` / `unsound`
# *warning*, not a vulnerability. Any future *vulnerability* suppression must
# carry a proven-non-reachability rationale, a structural pin of that
# assumption (a `cargo deny` wrapper ban), and a scheduled re-check that fails
# when an upstream fix propagates, so the suppression cannot outlive its
# justification (the retired quick-xml RUSTSEC-2026-0194/-0195 pair is the
# template: suppressed 2026-07-02, fix propagated and dropped 2026-07-08).
#
# Review cadence: re-walk on every Tauri bump and whenever a new advisory
# fires against a crate in our transitive tree.

[advisories]
ignore = [
    # glib: Iterator/DoubleEndedIterator unsoundness on `VariantStrIter`.
    # Transitive dep of the GTK stack the Linux build runs; the unsound
    # iterator is not on any first-party code path (we call no VariantStrIter
    # API), and the fix arrives with the upstream GTK-stack bump.
    "RUSTSEC-2024-0429", # glib

    # unic-*: family of unmaintained Unicode-data crates pulled transitively
    # through Tauri's macro/codegen tree. Build-time data-only crates; no
    # exploit surface in the runtime binary.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # proc-macro-error: unmaintained build-time macro procedure crate.
    # Transitive build-dep; not present in the runtime binary.
    "RUSTSEC-2024-0370", # proc-macro-error

    # fxhash: unmaintained non-cryptographic hash. Transitive; no security
    # surface (not used for any cryptographic or trust-bearing path).
    "RUSTSEC-2025-0057", # fxhash

    # rand 0.7.3 + 0.8.5: unsoundness with a custom logger using `rand::rng()`.
    # Both versions are transitive through Tauri's codegen tree (phf /
    # selectors / cssparser / html5ever). Build-time path; "custom logger"
    # attack vector is not present in our embedding. Single advisory ID
    # covers both rand versions.
    "RUSTSEC-2026-0097", # rand (0.7.3, 0.8.5)

    # zvariant, zbus_names, zvariant_derive: unmaintained as standalone crates
    # since zbus 6 absorbed them, not for any defect. They reach the graph only
    # through zbus 5 <- ashpd (the ScreenCast portal client behind eo-services'
    # `linux-capture` feature), so they are Linux-only and absent from the
    # Windows artefact. No ashpd release is on zbus 6 yet; drop these when one
    # is and the bump lands.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]
