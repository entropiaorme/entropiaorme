# Campaign configuration for the native-backend members.
#
# The campaign runs on the portable platform (the nightly's Linux
# runner), which compiles the Windows-only hook and window plumbing
# out: every mutant in that code would "miss" vacuously, telling us
# nothing. The platform CI leg compiles the real code and the live
# capture flows exercise it; the thin portable delegators it hides
# behind resolve to None here regardless, so their mutants are equally
# vacuous. Everything else stays in the campaign.
exclude_re = [
    # The Windows hook module and the platform window plumbing.
    "keystroke_source\\.rs.*windows_hook",
    "eu_window\\.rs.*platform::",
    # The cfg(windows)/cfg(not(windows)) trait pair: one side is
    # compiled out, the other is a one-line constant pinned by the
    # inert-behaviour test.
    "keystroke_source\\.rs.*HookKeystrokeSource>::(start|stop)",
    # Thin delegators over the platform lookups: None-on-this-platform
    # by construction.
    "eu_window\\.rs.*replace (find_game_window|get_window_geometry|game_window_present|live_region|capture_game_window)",
    # The screen capturer: the Windows GDI platform module and the thin
    # PNG/BGR grabbers over it. The portable platform's `capture_bgra` is a
    # `None` stub, so the grabbers short-circuit to `None` and their pixel-
    # conversion bodies are unreachable here; their mutants are as vacuous as
    # the eu_window lookups. The real capture flows are exercised on the
    # platform CI leg and the live scan.
    "screen_capture\\.rs.*platform",
    "screen_capture\\.rs.*replace (capture_region_png|capture_region_bgr|capturable_area) ->",
    # The application entry point and the substrate composition spawn: the
    # Tauri event-loop runner and the task that builds the AppState, publishes
    # it to the IPC command, and composes the native spine. Both are
    # integration glue exercised only by an actually running app (the
    # packaged-build verification), never by the hermetic suite; the
    # whole-function-deletion mutants here are vacuous. The wiring they perform
    # (producer composition, teardown, provider construction) is covered by its
    # own mutants in composition.rs, which stay in the campaign.
    "lib\\.rs.*replace run with \\(\\)",
    "lib\\.rs.*replace compose_substrate with \\(\\)",
    # The composition root's OCR/ONNX-Runtime orchestration wrappers. Their
    # LOGIC is mutation-tested in the helpers they delegate to (the path
    # resolvers `ort_dylib_path`/`models_dir`, the dylib pin
    # `pin_ort_dylib_env`, and `OcrEngine::new_with_providers`); these
    # whole-function-deletion mutants only ask "is the wrapper wired in",
    # which is integration-level: `compose_native` is the env/filesystem-
    # reading boundary (`compose_with` is the hermetic seam), `init_ort_runtime`
    # is the process-global once-only ORT init, and `build_ocr_engine` yields
    # an engine only when the runtime + GPU are present (host-gated). All are
    # exercised by the running app, not the portable campaign.
    "composition\\.rs.*replace compose_native ->",
    "composition\\.rs.*replace init_ort_runtime with \\(\\)",
    "composition\\.rs.*replace build_ocr_engine ->",
    # Release-only branch: `Some(dir) if !cfg!(debug_assertions)` selects the
    # installed resource dir; in the debug test build the guard is dead, so
    # flipping it to `false` is an equivalent mutant (the dev branch is taken
    # either way). The resolved paths are pinned by the resolver tests.
    "composition\\.rs.*replace match guard !cfg!\\(debug_assertions\\) with false",
    # Best-effort warm-up: runs a dummy inference and discards the result, so
    # it has no observable behaviour a test could assert (its only effect is
    # latency). Deleting its body is undetectable by construction.
    "ocr_engine\\.rs.*replace OcrEngine::warm_up with \\(\\)",
    # Provable equivalences in the Overview/Activity read paths: guard clauses
    # whose mutants compute an identical result on every reachable input.
    #   analytics.rs:2080  `if delta > 0.0` sits inside `if delta != 0.0`, so
    #     `>` and `>=` differ only at delta == 0, which the outer guard excludes.
    "analytics\\.rs.*replace > with >= in AnalyticsService::sell_inventory_item",
    #   analytics.rs:1408  `if total_known > 0` where total_known sums a GROUP
    #     BY's COUNT(*) values (each >= 1) over a non-empty row set, so it is
    #     always >= 1; the zero case where `>`/`>=` would differ is unreachable.
    #   analytics.rs:1437  `if total_shots > 0.0 && top/total >= threshold`:
    #     shots are non-negative, so at total_shots == 0 the top share is 0/0 =
    #     NaN, which fails the threshold either way; `>` and `>=` coincide.
    "analytics\\.rs.*replace > with >= in raw_session_agg",
    # Provable equivalences in the activity recommender's projection maths:
    # guard clauses and a bisection whose mutants compute an identical result
    # on every reachable input.
    #   activity_recommender.rs:208  `if is_attribute(name) || weight <= 0.0`
    #     in target_weights. The mutant (`&&`) admits attributes and zero-weight
    #     skills the original skips, but both consumers re-guard: projection_rows
    #     independently skips is_attribute before reading a target weight, and a
    #     weight contributes only via `level_gain * target_weight`, so a zero
    #     weight adds nothing. Reachable profession weights are non-negative, so
    #     the output is identical.
    "activity_recommender\\.rs.*replace \\|\\| with && in target_weights",
    #   activity_recommender.rs:284  `lo = (crossing - 1.0) * STEP` in
    #     pes_to_plus_one. `lo` is the bisection's lower bound; correctness needs
    #     only evaluate(lo) < 1 with the crossing above it. The mutant (`/`) only
    #     lowers lo further below the crossing, so the bisection converges to the
    #     same threshold. Line-anchored because the sibling `* with /` at :285:
    #     (the upper bound) is NOT equivalent and stays caught in the campaign.
    "activity_recommender\\.rs:284:.*replace \\* with / in pes_to_plus_one",
    #   activity_recommender.rs:288  `if evaluate(rows, mid) < 1.0` in
    #     pes_to_plus_one. `<` and `<=` differ only when the evaluation is exactly
    #     1.0, a measure-zero point the bisection never lands on; the returned
    #     bound is unchanged.
    "activity_recommender\\.rs.*replace < with <= in pes_to_plus_one",
    #   activity_recommender.rs:308  `(target_gain > 0.0).then(...)` in project.
    #     A row reaches here only with target_weight > 0 (zero/negative weights
    #     are excluded upstream) and level_gain > 0 (positive share and budget on
    #     a strictly increasing curve), so target_gain is strictly positive; the
    #     target_gain == 0 case where `>`/`>=` differ is unreachable.
    "activity_recommender\\.rs.*replace > with >= in project",
]
