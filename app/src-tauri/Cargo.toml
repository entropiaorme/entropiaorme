# Cargo workspace for the desktop application's Rust side.
#
# Members:
#   - entropia-orme: the Tauri shell (window chrome, the typed-command IPC
#     dispatch, native-service composition). The only member coupled to the
#     Tauri toolchain.
#   - eo-api:      the typed-command facade the shell dispatches into.
#   - eo-services: the domain services behind that facade.
#   - eo-wire:     wire-format contracts (response/event types, serialisation).
#
# The eo-* members are the native backend (facade, services, wire
# contracts). They are
# deliberately Tauri-free: CI builds and tests them on a runner without the
# Tauri toolchain's system stack, which structurally prevents a GUI dependency
# from creeping into backend code.

[workspace]
resolver = "2"
members = ["entropia-orme", "eo-api", "eo-services", "eo-wire", "xtask"]

[workspace.package]
version = "0.3.0"
authors = ["Mikel Williams-Lekuona <MikelWL@protonmail.com>"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Tauri is pinned to the 2.11 minor (the known-good release line when this
# workspace was laid down). The backend runs inside the shell process, and a
# mid-flight Tauri minor bump is a moving-target risk the pin removes;
# re-evaluate only on a major release with material benefit.
# tauri-build rides its matching minor for the same reason. Review the
# .cargo/audit.toml and deny.toml ignore lists together with any bump.
# `tray-icon` enables the system-tray API. It is compiled on every platform
# but exercised only on Linux (the shell builds a tray under
# `cfg(target_os = "linux")`), where a StatusNotifierItem gives the app a
# presence on a desktop whose windowing model treats an undecorated overlay
# app less predictably; Windows behaviour is unchanged (no tray is built there).
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-build = { version = "~2.6", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object members in insertion order end to end,
# which the typed command DTOs' byte-for-byte response fidelity (the facades
# build their response objects key-by-key) and the demo golden re-parse both
# rely on (the canonicalising emitters sort keys explicitly, so they are
# unaffected). float_roundtrip makes float
# parsing correctly rounded (the default fast path can land one ULP off),
# which the goldens' parsed-value comparisons and any golden re-parse rely
# on for exactness.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The OCR recogniser runtime. `load-dynamic` binds the ONNX Runtime
# shared library at process start rather than link time, so builds and
# tests need no native toolkit; hosts without the runtime skip the
# engine-running tests honestly. (Execution providers are a
# composition-root concern; the recogniser itself is EP-agnostic.)
# The release-candidate pin is deliberate: the 2.0 line is the only
# maintained binding for the current ONNX Runtime API, rc versions are
# immutable and checksum-locked, and the audit cadence bumps this to
# 2.0.0 final when it lands.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "std", "api-24", "directml"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows = "0.61"
# Linux counterparts of the Windows input plumbing: the fallback passive
# keystroke observer reads the kernel evdev nodes; libc supplies the
# poll(2) and fcntl(2) calls that keep the reads interruptible.
evdev = "0.13"
libc = "0.2"
# Pure-Rust, safe X11 protocol bindings: the Linux game-window discovery
# and geometry lookups run over XWayland (where the game and our windows
# both live), mirroring the Windows EnumWindows/GetClientRect helpers.
# XInput2 carries the primary Linux keystroke observer: raw key events
# from the X server, which include keys injected by remappers such as
# Steam Input that never pass through the kernel input layer.
x11rb = { version = "0.13", features = ["xinput"] }
# Wayland screen capture: the ScreenCast desktop portal opens a consented
# PipeWire stream (ashpd drives the portal D-Bus dance + restore tokens);
# GStreamer consumes the node as frames. GStreamer is already an app-level
# runtime dependency via WebKitGTK's media backend, so binding to it adds
# no new package dependency.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
# The chatlog parser's line grammar: plain regular expressions (the one
# Python lookahead is reproduced as an explicit post-match check), the
# client's timestamp format via chrono, and the HTML5 named-entity set
# matching the original's unescaping.
regex = "1"
# NFKD decomposition for the quest-name normaliser: the mission-name
# matcher folds accented characters to their ASCII base before
# comparison, exactly as the backend's normalise step does.
unicode-normalization = "0.1"
# Session and kill identities: random v4, exactly the original's
# uuid4() (the equivalence normaliser maps ids to symbols by encounter
# order, so randomness never reaches a golden).
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
html-escape = "0.2"
# The persistence stack: the synchronous SQLite core behind the database
# seam, which sits behind a narrow handle so the driver stays swappable.
# Pinned to the 0.39 minor; `bundled` compiles a private SQLite so the graph
# carries exactly one copy (the `links` key permits no second).
rusqlite = { version = "~0.39", features = ["bundled", "hooks"] }
# SHA-384 for the migration ledger's checksum column (the accounting the
# database seam validates on every open).
sha2 = "0.10"
# Throwaway data directories for the hermetic tests that boot a facade over
# a temp data dir.
tempfile = "3"
criterion = "0.8"
# Shortest round-trip float digits, parsed and reformatted to match Python's
# float repr byte-for-byte in the equivalence Normalizer (eo-wire).
ryu = "1"
# Property-based testing of pure service arithmetic (eo-services
# dev-dependency).
proptest = "1"
# Decode the raw-capture HTTP bodies in the equivalence emitter proof
# (eo-wire dev-dependency).
base64 = "0.22"
# Structured diagnostics + telemetry (the observability floor). `tracing` is
# the facade the workspace instruments with (already in the tree transitively;
# this promotes it to a direct dependency); `tracing-subscriber` builds the
# process-wide subscriber: a fmt layer (stderr and the rolling file appender),
# an env-filter, and the metrics-aggregating layer that feeds the in-process
# registry. Both are MIT, already on the deny.toml allowlist.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "fmt",
    "env-filter",
    "ansi",
    "std",
] }
# The non-blocking rolling-file appender for the local structured logs: a
# background worker thread drains an MPSC channel so a slow disk never stalls a
# hot path. MIT, already on the deny.toml allowlist.
tracing-appender = "0.2"
# Derived error types across the backend crates: every fallible seam carries
# a typed error with a `source()` chain instead of a stringly `Result<_,
# String>`; wire-facing texts live as explicit Display strings on variants.
thiserror = "2"
# JSON-Schema derives on the IPC facade's DTOs: the schema is the
# intermediate representation the owned TypeScript generator (`cargo xtask
# gen-ts`) emits bindings from, read straight off the serde attributes so
# the generated types cannot drift from the wire serialisation.
schemars = "1"

eo-api = { path = "eo-api" }
eo-services = { path = "eo-services" }
eo-wire = { path = "eo-wire" }
