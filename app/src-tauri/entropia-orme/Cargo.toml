[package]
name = "entropia-orme"
version.workspace = true
description = "EntropiaOrme: an analytical desktop tool for Entropia Universe."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "entropia_orme_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
eo-api = { workspace = true }
# The composition root constructs the domain services the typed-command
# facade reads through.
eo-services = { workspace = true }
# The composition root owns the SSE fan-out hub and bridges the producer
# bus's domain topics onto it (the `/api/events` stream serves over it).
eo-wire = { workspace = true }
# The hotbar slot resolver runs on the input listener's plain OS key thread
# (no async runtime), so it reads the equipment library through the database
# handle's synchronous reader core rather than bridging an async query onto
# the runtime.
rusqlite = { workspace = true }
# The capture-PNG IPC command base64-encodes the raw image bytes into an
# `<img>` data URL (the capture returns raw bytes, outside the typed JSON
# command surface).
base64 = { workspace = true }
tokio = { workspace = true }
# The composition root discharges the ONNX Runtime obligations the
# recogniser depends on: it pins the bundled dylib to an absolute path
# (`ort::init_from`) and configures the execution-provider ladder before
# any session is built. The recogniser itself (in eo-services) stays
# EP-agnostic; the runtime wiring is a composition-root concern.
ort = { workspace = true }
# The composition root installs the process-wide tracing subscriber: a fmt
# layer, an env-filter, and the metrics-aggregating layer that turns the
# database core's per-job timing events into database-latency samples in the
# in-process registry.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: the composition-integration and concurrency tests assert
# directly against the database through its closure API (rusqlite is already
# a normal dependency) and build a frozen clock.
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The page size behind the /proc resident-set sampler (resources.rs).
libc = { workspace = true }
# The shell links the GStreamer stack (through WebKitGTK) anyway, so it is
# the right place to enable the Linux ScreenCast-portal capture backend that
# the backend member keeps optional to stay system-library-free.
eo-services = { workspace = true, features = ["linux-capture"] }
