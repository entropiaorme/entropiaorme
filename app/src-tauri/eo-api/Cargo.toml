# The IPC facade: the application boundary the typed Tauri commands call
# into. Owns the request/response DTO types (serde + JSON-Schema derives,
# the source the TypeScript bindings generate from) and one async method
# per operation over the domain services. Deliberately Tauri-free, like
# the other backend members: the shell wraps each method in a thin
# `#[tauri::command]`.

[package]
name = "eo-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
eo-services = { workspace = true }
eo-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
# The database write spine's closure API (`Db::with_writer`) hands the
# transport-layer edit flows a `rusqlite::Connection`; the projection-hook
# chain they drive runs synchronously on it.
rusqlite = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
