[package]
name = "eo-services"
version.workspace = true
description = "Domain services for the EntropiaOrme backend: the service layer behind the HTTP surface, ported service by service from the Python implementation."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Criterion benches carry their own harness; disable libtest's bench
# harness on the library target so `cargo bench` runs criterion only.
bench = false

[dependencies]
eo-wire = { workspace = true }
regex = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
html-escape = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ort = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
rapidfuzz = "0.5"
# The analytics ledger's opaque keyset cursor (base64url of the seek key).
base64 = { workspace = true }
# Observe-only instrumentation at the event-bus, OCR, and database seams
# (structured events for the logs; the metrics registry is in eo-wire).
tracing = { workspace = true }
# The synchronous SQLite core behind the `db` seam (see the workspace
# manifest for the libsqlite3-sys pairing constraint).
rusqlite = { workspace = true }
# SHA-384 for the migration ledger's checksum accounting.
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Passive global key observation via the kernel input layer: the Linux
# fallback behind the keystroke source seam (keystroke_source.rs) when no
# X server answers.
# Pure-Rust (no system libraries), so a backend-member build stays free of
# the Tauri system stack.
evdev = { workspace = true }
libc = { workspace = true }
# Game-window discovery + geometry over X11/XWayland (eu_window.rs), and
# the primary Linux keystroke observer over XInput2 raw key events
# (keystroke_source.rs). Pure-Rust X11 protocol bindings, likewise
# system-library-free.
x11rb = { workspace = true }
# ScreenCast-portal + PipeWire screen capture (screen_capture.rs). GStreamer
# links the system glib/gstreamer libraries, which the backend members must
# NOT require to build (the toolchain-free-members invariant). So these are
# optional and gated behind the `linux-capture` feature: the default backend
# build omits them and the capture seam stands down, and only the Tauri shell
# (which links the same GStreamer stack through WebKitGTK anyway) enables it.
ashpd = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[features]
# Enables the Linux ScreenCast-portal capture backend and its GStreamer
# dependencies. Off by default so backend-member builds need no system stack;
# the shell turns it on for Linux packaging.
linux-capture = ["dep:ashpd", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# Test-only: a capturing layer for the eo::input breadcrumb instrument test.
tracing-subscriber = { workspace = true }

[[bench]]
name = "smoke"
harness = false

[[bench]]
name = "ocr"
harness = false
