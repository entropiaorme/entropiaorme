name: screen_ignored_weapon_key
flavour: scripted
description: >
  The pistol is seen in hand. The cannon's hotbar key is pressed but the
  screen still shows the pistol: the key declares nothing, the pistol
  keeps its hits, and a hit only the cannon fits is evidence against
  it.
surfaces:
  - tracking-held-tool-screen
  - tracking-kill-creation
events: 4
expected_kills: 1
character_context:
  profession_set: ""
  location: ""
  mob_species: ""
notes: >
  Hand-authored. carried.json names the three library weapons (pistol
  5-10, cannon 20-40, rifle 8-16 regular bands); screen.json turns the
  reading of the tool in hand on and names the bundled tools the library
  does not hold; steps.jsonl interleaves the chat log's tick groups with
  the changes read off the screen, hotbar presses and clock steps.

# The committed clock plan: the frozen, driver-advanced instant schedule a
# replay of this scenario runs on (parsed by load_clock_plan in the corpus
# replay test). The start instant is chosen away from the scenario's chat-log
# instants so a plan-stamped timestamp never collides with a domain timestamp.
clock:
  start: 2026-01-01T00:00:00
  step_seconds: 1.0
