name: weapon_held_across_sessions
flavour: scripted
description: >
  The weapon in hand carries across a session boundary. A pistol is
  pressed and fired to a kill; the session stops and the next starts in
  the same process with no press. A critical hit both carried weapons
  could have dealt prices to the pistol, still the weapon in hand, rather
  than going unpriced, and the readout reports it declared.
surfaces:
  - tracking-weapon-attribution-agreement
  - tracking-weapon-attribution-held-across-sessions
  - tracking-kill-creation
events: 5
expected_kills: 2
character_context:
  profession_set: ""
  location: ""
  mob_species: ""
notes: >
  Hand-authored. carried.json names two carried weapons whose bands
  overlap on a critical (pistol 5-10, critical reach to 30; cannon 20-40).
  steps.jsonl presses the pistol in the first session only and reads the
  second session's readout after the overlapping hit.

# The committed clock plan: the frozen, driver-advanced instant schedule a
# replay of this scenario runs on (parsed by load_clock_plan in the corpus
# replay test). The start instant is chosen away from the scenario's chat-log
# instants so a plan-stamped timestamp never collides with a domain timestamp.
clock:
  start: 2026-01-01T00:00:00
  step_seconds: 1.0
