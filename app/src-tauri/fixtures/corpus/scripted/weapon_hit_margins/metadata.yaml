name: weapon_hit_margins
flavour: scripted
description: >
  Hits outside the held weapon's listed range. A pistol is pressed; a hit
  in its band agrees silently, hits above it up to half again its maximum
  and a hit below it are priced to the pistol and kept as boosted and
  reduced, and a hit past the boosted reach stays unpriced. A critical
  inside its own reach is an ordinary hit.
surfaces:
  - tracking-weapon-attribution-agreement
  - tracking-weapon-attribution-margins
  - tracking-weapon-attribution-unresolved
  - tracking-kill-creation
events: 8
expected_kills: 2
character_context:
  profession_set: ""
  location: ""
  mob_species: ""
notes: >
  Hand-authored. carried.json names the two carried weapons (pistol 5-10,
  cannon 20-40 regular bands); steps.jsonl presses the pistol before the
  first hit.

