# Repository maintenance task runner.
#
# Hosts the repository's CI guards and maintenance tools (the authoring-discipline
# lint, the version-stamp parity check, the architecture guards, the TypeScript
# binding generator, and the mutation-score report). Each is a subcommand of a
# single `xtask` binary, dispatched from main.rs.
#
# Dependencies are kept minimal: standard library, git invoked via
# std::process::Command, plus serde_json and regex (both already vendored in the
# workspace) for JSON parsing and the report/diff grammars.
[package]
name = "xtask"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
regex = { workspace = true }
# The typed-IPC facade: `gen-ts` walks its command manifest and DTO
# schemas to emit the committed TypeScript bindings.
eo-api = { workspace = true }
